<textarea id="myOrderText"></textarea>
<button onclick="handleClick()">Explain</button>
<div id="output"></div>

<script type="module">
  import { summarizeDocument } from './api.js';

  window.handleClick = async function() {
    const text = document.getElementById("myOrderText").value;
    const outputDiv = document.getElementById("output");
    
    outputDiv.innerText = "Processing...";
    try {
      const data = await summarizeDocument(text, "Hindi");
      outputDiv.innerHTML = `
        <h3>${data.case_headline}</h3>
        <p>${data.verdict_summary}</p>
      `;
    } catch (e) {
      outputDiv.innerText = "Failed to load summary.";
    }
  };
</script>
